[tool.poetry]
name = "scailes"
version = "0.1.0"
description = "An image classifier for classifying farmed and wild Atlantic salmon fish scales"
authors = [
    "Malte Willmes",
    "Anders Aamodt",
    "Børge Solli Andreassen",
    "Lina Victoria Tuddenham Haug",
    "Enghild Steinkjer",
    "Gunnel M. Østborg",
    "Gitte Løkeberg",
    "Peder Fiske",
    "Geir R. Brandt",
    "Terje Mikalsen",
    "Arne Siversten",
    "Magnus Moustache",
    "June Larsen Ydsti",
    "Bjørn Florø-Larsen",
]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
jupyter = "^1.0.0"
pandas = { extras = ["pyarrow"], version = "^2.2.0" }
scienceplots = "^2.1.1"
matplotlib = "^3.8.3"
openpyxl = "^3.1.2"
lightning = "^2.2.1"
tensorboard = "^2.16.2"
torchvision = "^0.17.0"
hydra-core = "^1.3.2"
pydantic = "^2.6.2"
pandas-stubs = "^2.2.0.240218"
types-pillow = "^10.2.0.20240213"
pyarrow = "^15.0.0"
umap-learn = "^0.5.5"
seaborn = "^0.13.2"
onnx = "^1.15.0"
onnxruntime = "^1.17.1"
noise = "^1.2.2"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-cov = "^4.1.0"
black = { extras = ["jupyter"], version = "^23.12.1" }
flake8 = "^7.0.0"
mypy = "^1.8.0"
isort = "^5.13.2"
azure-storage-blob = "^12.19.0"
pre-commit = "^3.6.0"
python-dotenv = "^1.0.1"
ipympl = "^0.9.3"
einops = "^0.7.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
python_version = "3.11"
files = "**/*.py"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torchvision.*", "seaborn.*", "onnx.*"]
ignore_missing_imports = true


[tool.isort]
profile = "black"

[tool.black]
exclude = "^.+ipynb$"
